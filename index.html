<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini F1 Sprint</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Mini F1 Sprint</h1>
      <p class="instructions">
        Move with <kbd>←</kbd> and <kbd>→</kbd>. Avoid rival cars and survive as
        long as possible.
      </p>
      <section class="hud">
        <span>Score: <strong id="score">0</strong></span>
        <span>Speed: <strong id="speed">1</strong>x</span>
      </section>
      <canvas id="track" width="360" height="640" aria-label="F1 race track"></canvas>
      <button id="restart" hidden>Restart Race</button>
      <p id="status">Race started!</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
